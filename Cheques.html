<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
<title>Preenchedor de Cheques · Supermercado Veneza</title>
<link rel="stylesheet" href="/styles/veneza.css">
<style>
  .money-input { position: relative; }
  .money-input span {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-weight: 600;
    color: var(--suave);
  }
  .money-input .campo { padding-left: 42px; }

  .section-title {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 16px 0 6px;
  }
  .section-title .rotulo { margin: 0; }
  #contador { font-size: .85rem; color: var(--suave); }

  .prazo-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .prazo-row input {
    flex: 1;
    min-width: 0;
    min-height: var(--toque);
    padding: 8px 12px;
    font: inherit;
    font-size: 1.1rem;
    font-weight: 600;
    text-align: center;
    color: var(--texto);
    background: var(--superficie);
    border: 1px solid var(--borda);
    border-radius: 8px;
  }
  .prazo-row input:focus { border-color: var(--primaria); outline: none; box-shadow: 0 0 0 3px var(--primaria-clara); }
  .remove-btn {
    width: var(--toque);
    height: var(--toque);
    flex: 0 0 auto;
    border: 1px solid var(--borda);
    border-radius: 8px;
    background: var(--superficie-2);
    color: var(--ruim);
    font-size: 1.4rem;
    cursor: pointer;
  }
  .add-btn {
    width: 100%;
    min-height: 44px;
    border: 1px dashed var(--borda);
    border-radius: 8px;
    background: transparent;
    color: var(--texto);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  #erro { display: none; }
  .calculate-btn { margin-top: 12px; }

  .resultado-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
  .resultado-header h2 { margin: 0; }

  .cheque {
    border: 1px solid var(--borda);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 8px;
    background: var(--superficie);
  }
  .cheque-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .cheque-numero { font-size: .8rem; font-weight: 700; color: var(--suave); text-transform: uppercase; letter-spacing: .04em; }
  .cheque-valor { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .extenso { font-size: .9rem; line-height: 1.4; font-weight: 600; text-transform: uppercase; margin: 6px 0 10px; }
  .data {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--primaria-clara);
    color: var(--texto);
    padding: 5px 10px;
    border-radius: 999px;
    font-size: .88rem;
    font-weight: 600;
  }
  .resumo {
    display: flex;
    justify-content: space-between;
    border-top: 1px solid var(--borda);
    margin-top: 10px;
    padding-top: 10px;
    color: var(--suave);
    font-variant-numeric: tabular-nums;
  }
  .resumo strong { color: var(--texto); font-size: 1.1rem; }
</style>
</head>

<body>

<div class="pagina estreita">

  <header class="topo-ferramenta">
    <a class="voltar" href="/">‹ Supermercado Veneza</a>
    <h1>Preenchedor de Cheques</h1>
    <p>Informe o valor e os prazos dos pagamentos</p>
  </header>

  <main>
  <div class="cartao">

    <label class="rotulo" for="valor">Valor total do pedido</label>

    <div class="money-input">
      <span>R$</span>
      <input
        id="valor"
        class="campo"
        type="text"
        inputmode="decimal"
        placeholder="0,00"
        autocomplete="off"
      >
    </div>

    <div class="section-title">
      <span class="rotulo">Prazos dos cheques (dias)</span>
      <span id="contador">1 cheque</span>
    </div>

    <div id="prazos"></div>

    <button type="button" class="add-btn" onclick="adicionarPrazo()">
      + Adicionar prazo
    </button>

    <div id="erro" class="erro" role="alert"></div>

    <button type="button" class="botao primario largo calculate-btn" onclick="calcular()">
      Calcular cheques
    </button>

  </div>

  <div class="cartao" id="resultadoCard">

    <div class="resultado-header">
      <h2>Resultado</h2>
      <button type="button" class="botao pequeno copy-btn" onclick="copiarTudo()">Copiar</button>
    </div>

    <div id="resultado">
      <div class="vazio">
        Informe o valor e os prazos para calcular.
      </div>
    </div>

  </div>
  </main>

  <footer class="rodape">
    <a href="/">‹ Voltar para o início</a>
  </footer>

</div>

<script src="/js/extenso.js"></script>
<script>

let contadorPrazos = 0;

/* =========================
   PRAZOS
========================= */

function adicionarPrazo(valor = "") {

  contadorPrazos++;

  const container = document.getElementById("prazos");

  const row = document.createElement("div");
  row.className = "prazo-row";
  row.id = "prazo-" + contadorPrazos;

  row.innerHTML = `
    <input
      type="number"
      min="0"
      step="1"
      placeholder="Dias"
      value="${valor}"
      class="prazo-input"
      onkeydown="enterCalcula(event)"
    >

    <button
      class="remove-btn"
      onclick="removerPrazo(${contadorPrazos})"
      title="Remover"
    >×</button>
  `;

  container.appendChild(row);

  atualizarContador();

  row.querySelector("input").focus();
}


function removerPrazo(id) {

  const row = document.getElementById("prazo-" + id);

  if (row) {
    row.remove();
  }

  atualizarContador();
}


function atualizarContador() {

  const quantidade =
    document.querySelectorAll(".prazo-input").length;

  document.getElementById("contador").textContent =
    quantidade === 1
      ? "1 cheque"
      : quantidade + " cheques";
}


/* =========================
   MOEDA
========================= */

function converterValor(valor) {

  if (!valor) return 0;

  valor = valor
    .replace(/\s/g, "")
    .replace("R$", "");

  /*
    Aceita:
    2950
    2950,00
    2.950,00
    2.950
  */

  if (valor.includes(",")) {

    valor = valor.replace(/\./g, "");
    valor = valor.replace(",", ".");

  } else {

    /*
      Se não houver vírgula,
      entende como número inteiro.
    */

    valor = valor.replace(/\./g, "");
  }

  const numero = parseFloat(valor);

  return isNaN(numero) ? 0 : numero;
}


function formatarMoeda(valor) {

  return valor.toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL"
  });
}


document.getElementById("valor").addEventListener("input", function(e) {

  let valor = e.target.value;

  valor = valor.replace(/[^\d,]/g, "");

  const partes = valor.split(",");

  if (partes.length > 2) {
    valor = partes[0] + "," + partes.slice(1).join("");
  }

  if (partes[1]) {
    valor =
      partes[0] +
      "," +
      partes[1].substring(0, 2);
  }

  e.target.value = valor;
});


/* =========================
   EXTENSO
========================= */

// O texto por extenso vem de /js/extenso.js (mesma função do conversor, com testes)
function numeroPorExtenso(numero) {
  return Extenso.reais(Math.round(numero * 100));
}


/* =========================
   DATA
========================= */

function adicionarDias(data, dias) {

  const novaData = new Date(data);

  novaData.setDate(
    novaData.getDate() + dias
  );

  return novaData;
}


function formatarData(data) {

  return data.toLocaleDateString("pt-BR", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  });
}


/* =========================
   CALCULAR
========================= */

function calcular() {

  esconderErro();

  const valor = converterValor(
    document.getElementById("valor").value
  );

  const inputs =
    document.querySelectorAll(".prazo-input");

  const prazos = [];

  inputs.forEach(input => {

    const prazo = parseInt(input.value);

    if (!isNaN(prazo) && prazo >= 0) {
      prazos.push(prazo);
    }
  });


  if (valor <= 0) {
    mostrarErro("Informe um valor válido.");
    return;
  }


  if (prazos.length === 0) {
    mostrarErro("Informe pelo menos um prazo.");
    return;
  }


  /*
    Trabalhamos em centavos para evitar
    problemas de arredondamento.
  */

  const totalCentavos =
    Math.round(valor * 100);

  const quantidade = prazos.length;

  const valorBase =
    Math.floor(totalCentavos / quantidade);

  const resto =
    totalCentavos % quantidade;


  /*
    A data base é SEMPRE hoje.
  */

  const hoje = new Date();

  hoje.setHours(0, 0, 0, 0);


  let html = "";

  let textoCopiar = "";

  let soma = 0;


  prazos.forEach((prazo, index) => {

    /*
      Distribui os centavos restantes
      nos primeiros cheques.
    */

    const centavos =
      valorBase + (index < resto ? 1 : 0);

    soma += centavos;

    const valorParcela =
      centavos / 100;

    const vencimento =
      adicionarDias(hoje, prazo);

    const extenso =
      numeroPorExtenso(valorParcela);


    html += `
      <div class="cheque">

        <div class="cheque-top">

          <div class="cheque-numero">
            Cheque ${String(index + 1).padStart(2, "0")}
          </div>

          <div class="cheque-valor">
            ${formatarMoeda(valorParcela)}
          </div>

        </div>

        <div class="extenso">
          ${extenso}
        </div>

        <div class="data">
          📅 ${formatarData(vencimento)}
          <span>•</span>
          ${prazo} ${prazo === 1 ? "dia" : "dias"}
        </div>

      </div>
    `;


    textoCopiar +=
      `CHEQUE ${String(index + 1).padStart(2, "0")}\n` +
      `Valor: ${formatarMoeda(valorParcela)}\n` +
      `Por extenso: ${extenso.toUpperCase()}\n` +
      `Vencimento: ${formatarData(vencimento)} (${prazo} dias)\n\n`;
  });


  html += `
    <div class="resumo">
      <span>Total</span>
      <strong>${formatarMoeda(soma / 100)}</strong>
    </div>
  `;


  document.getElementById("resultado").innerHTML = html;

  window.textoCopiar = textoCopiar.trim();

  document.getElementById("resultadoCard")
    .scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
}


/* =========================
   COPIAR
========================= */

function copiarTudo() {

  if (!window.textoCopiar) {
    return;
  }

  navigator.clipboard.writeText(
    window.textoCopiar
  ).then(() => {

    const btn =
      document.querySelector(".copy-btn");

    const original = btn.textContent;

    btn.textContent = "✓ Copiado";

    setTimeout(() => {
      btn.textContent = original;
    }, 1500);

  }).catch(() => {

    alert("Não foi possível copiar.");

  });
}


/* =========================
   ERROS
========================= */

function mostrarErro(mensagem) {

  const erro =
    document.getElementById("erro");

  erro.textContent = mensagem;
  erro.style.display = "block";
}


function esconderErro() {

  document.getElementById("erro")
    .style.display = "none";
}


/* =========================
   ENTER
========================= */

function enterCalcula(event) {

  if (event.key === "Enter") {
    calcular();
  }
}


/* =========================
   INICIALIZAÇÃO
========================= */

adicionarPrazo();


/*
  Exemplo:
  Valor: 2950
  Prazo: 30 / 45

  Resultado:
  1475,00 - data +30 dias
  1475,00 - data +45 dias
*/

</script>

</body>
</html>
