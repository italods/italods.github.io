<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)" />
  <title>Valor por Extenso · Supermercado Veneza</title>
  <link rel="stylesheet" href="/styles/veneza.css" />
  <style>
    .extenso-resultado {
      margin: 14px 0 0;
      padding: 12px;
      background: var(--primaria-clara);
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.4;
      min-height: 3em;
    }
    .extenso-resultado .rotulo { margin: 0 0 4px; color: var(--suave); font-size: .85rem; }
  </style>
  <script>
    function numeroParaExtenso(valor) {
        const unidades = ["", "um", "dois", "três", "quatro", "cinco", "seis", "sete", "oito", "nove", "dez", "onze", "doze", "treze", "quatorze", "quinze", "dezesseis", "dezessete", "dezoito", "dezenove"];
        const dezenas = ["", "dez", "vinte", "trinta", "quarenta", "cinquenta", "sessenta", "setenta", "oitenta", "noventa"];
        const centenas = ["", "cem", "duzentos", "trezentos", "quatrocentos", "quinhentos", "seiscentos", "setecentos", "oitocentos", "novecentos"];
        
        function converterNumero(n) {
            if (n < 20) return unidades[n];
            if (n < 100) return dezenas[Math.floor(n / 10)] + (n % 10 !== 0 ? " e " + unidades[n % 10] : "");
            if (n < 1000) return (n === 100 ? "cem" : centenas[Math.floor(n / 100)]) + (n % 100 !== 0 ? " e " + converterNumero(n % 100) : "");
            if (n < 1000000) {
                let milhar = Math.floor(n / 1000);
                let resto = n % 1000;
                let extenso = milhar === 1 ? "mil" : converterNumero(milhar) + " mil";
                return extenso + (resto ? " " + converterNumero(resto) : "");
            }
            return "Valor muito alto";
        }
        
        let reais = Math.floor(valor / 100);
        let centavos = valor % 100;
        let resultado = converterNumero(reais) + " reais";
        if (centavos > 0) resultado += " e " + converterNumero(centavos) + (centavos === 1 ? " centavo" : " centavos");
        return resultado;
    }
    
    function atualizarExtenso() {
        let valor = document.getElementById("valor").value.replace(/\D/g, "");
        valor = valor ? parseInt(valor, 10) : 0;
        document.getElementById("valor").value = (valor / 100).toLocaleString("pt-BR", {minimumFractionDigits: 2});
        document.getElementById("extenso").innerText = numeroParaExtenso(valor);
    }
</script>
</head>
<body>
  <div class="pagina estreita">
    <header class="topo-ferramenta">
      <a class="voltar" href="/">‹ Supermercado Veneza</a>
      <h1>Valor por Extenso</h1>
      <p>Digite só os números: 1999 vira R$ 19,99.</p>
    </header>

    <main>
      <div class="cartao">
        <label class="rotulo" for="valor">Valor (R$)</label>
        <input type="text" id="valor" class="campo" inputmode="numeric" autocomplete="off" oninput="atualizarExtenso()" placeholder="0,00">
        <div class="extenso-resultado" aria-live="polite">
          <span class="rotulo">Por extenso</span>
          <span id="extenso">Zero reais</span>
        </div>
      </div>
    </main>

    <footer class="rodape">
      <a href="/">‹ Voltar para o início</a>
    </footer>
  </div>
</body>
</html>
