  <script>
    function numeroParaExtenso(valor) {
        const unidades = ["", "um", "dois", "três", "quatro", "cinco", "seis", "sete", "oito", "nove", "dez", "onze", "doze", "treze", "quatorze", "quinze", "dezesseis", "dezessete", "dezoito", "dezenove"];
        const dezenas = ["", "dez", "vinte", "trinta", "quarenta", "cinquenta", "sessenta", "setenta", "oitenta", "noventa"];
        const centenas = ["", "cem", "duzentos", "trezentos", "quatrocentos", "quinhentos", "seiscentos", "setecentos", "oitocentos", "novecentos"];
        
        function converterNumero(n) {
            if (n < 20) return unidades[n];
            if (n < 100) return dezenas[Math.floor(n / 10)] + (n % 10 !== 0 ? " e " + unidades[n % 10] : "");
            if (n < 1000) return (n === 100 ? "cem" : centenas[Math.floor(n / 100)]) + (n % 100 !== 0 ? " e " + converterNumero(n % 100) : "");
            if (n < 1000000) {
                let milhar = Math.floor(n / 1000);
                let resto = n % 1000;
                let extenso = milhar === 1 ? "mil" : converterNumero(milhar) + " mil";
                return extenso + (resto ? " " + converterNumero(resto) : "");
            }
            return "Valor muito alto";
        }
        
        let reais = Math.floor(valor / 100);
        let centavos = valor % 100;
        let resultado = converterNumero(reais) + " reais";
        if (centavos > 0) resultado += " e " + converterNumero(centavos) + (centavos === 1 ? " centavo" : " centavos");
        return resultado;
    }
    
    function atualizarExtenso() {
        let valor = document.getElementById("valor").value.replace(/\D/g, "");
        valor = valor ? parseInt(valor, 10) : 0;
        document.getElementById("valor").value = (valor / 100).toLocaleString("pt-BR", {minimumFractionDigits: 2});
        document.getElementById("extenso").innerText = numeroParaExtenso(valor);
    }
</script>
